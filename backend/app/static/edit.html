<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактор кампании — Keitaro Wrapper</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Редактор кампании</h1>
        <nav>
          <a href="/">Создать</a>
          <a href="/edit.html" class="active">Редактор</a>
          <a href="/docs" target="_blank">API</a>
        </nav>
      </header>

      <div id="message" class="message"></div>

      <fieldset>
        <legend>Выбор кампании</legend>
        <div class="field">
          <label for="campaign-select">Кампания</label>
          <select id="campaign-select">
            <option value="">Загрузка…</option>
          </select>
          <div class="hint">Показаны активные кампании</div>
        </div>
      </fieldset>

      <div id="detail"></div>
    </main>

    <script src="/common.js"></script>
    <script>
      const select = document.getElementById("campaign-select")
      const detail = document.getElementById("detail")
      const message = document.getElementById("message")

      let offersCache = []

      function streamOffers(stream, campaignId, usedInCampaign) {
        const total = stream.offers.reduce((sum, o) => sum + o.share, 0)
        const balanced = total === 100 && stream.offers.length > 0
        const rows = stream.offers
          .map(
            (o) => `
              <tr>
                <td>${o.offer_id}</td>
                <td>${o.share}%</td>
                <td>${escapeHtml(o.state)}</td>
                <td>
                  <button
                    type="button"
                    class="danger"
                    data-action="remove-offer"
                    data-campaign="${campaignId}"
                    data-stream="${stream.id}"
                    data-offer="${o.offer_id}"
                  >Delete</button>
                </td>
              </tr>`,
          )
          .join("")

        if (stream.schema_ === "redirect") {
          const redirectNote = stream.offers.length
            ? `<p class="warn">Офферы в этом потоке не используются: схема redirect отправляет на URL.</p>`
            : ""
          return `
            <div class="empty">
              Поток редиректа — отправляет на <code>${escapeHtml(stream.action_payload || "URL")}</code>.
              Офферы не используются.
            </div>
            ${redirectNote}`
        }

        const table = stream.offers.length
          ? `<table>
              <thead>
                <tr><th>Offer ID</th><th>Доля</th><th>Статус</th><th></th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>`
          : '<p class="empty">Офферов нет — поток ничего не покажет</p>'

        const available = offersCache.filter((o) => !usedInCampaign.has(o.id))
        const options = available.length
          ? available
              .map((o) => `<option value="${o.id}">${escapeHtml(o.name)} (id ${o.id})</option>`)
              .join("")
          : '<option value="">Нет доступных офферов</option>'

        const addForm = `
          <div class="add-offer">
            <select data-add-select="${stream.id}" ${available.length ? "" : "disabled"}>
              ${options}
            </select>
            <button
              type="button"
              data-action="add-offer"
              data-campaign="${campaignId}"
              data-stream="${stream.id}"
              ${available.length ? "" : "disabled"}
            >Add</button>
          </div>`

        return `
          ${table}
          <p class="hint">
            Сумма долей: <strong>${total}%</strong>
            ${balanced ? "" : ' <span class="warn">— не равна 100%</span>'}
          </p>
          ${addForm}`
      }

      function streamFilters(stream) {
        if (!stream.filters.length) {
          return '<span class="empty">Без фильтров — ловит всех</span>'
        }
        return stream.filters
          .map(
            (f) => `
              <div class="hint">
                <code>${escapeHtml(f.name)}</code>
                ${escapeHtml(f.mode)} → ${escapeHtml(f.payload.join(", "))}
              </div>`,
          )
          .join("")
      }

      function renderDetail(data) {
        const { campaign, streams } = data
        const sorted = [...streams].sort((a, b) => a.position - b.position)
        const usedInCampaign = new Set(
          streams.flatMap((s) => s.offers.map((o) => o.offer_id)),
        )

        const streamsHtml = sorted
          .map(
            (s) => `
              <fieldset>
                <legend>
                  Поток ${s.position}: ${escapeHtml(s.name)}
                  <span class="badge ${s.schema_ === "redirect" ? "redirect" : ""}">
                    ${escapeHtml(s.schema_)}
                  </span>
                </legend>
                ${s.action_payload ? `<p class="hint">Редирект → <code>${escapeHtml(s.action_payload)}</code></p>` : ""}
                ${streamFilters(s)}
                ${streamOffers(s, campaign.id, usedInCampaign)}
              </fieldset>`,
          )
          .join("")

        detail.innerHTML = `
          <fieldset>
            <legend>Кампания</legend>
            <table>
              <tbody>
                <tr><th>ID</th><td>${campaign.id}</td></tr>
                <tr><th>Название</th><td>${escapeHtml(campaign.name)}</td></tr>
                <tr><th>Домен</th><td>${escapeHtml(campaign.domain || campaign.domain_id)}</td></tr>
                <tr><th>Статус</th><td><span class="badge">${escapeHtml(campaign.state)}</span></td></tr>
              </tbody>
            </table>
          </fieldset>
          ${streamsHtml || '<div class="empty">У кампании нет потоков</div>'}`
      }

      async function loadDetail(id) {
        if (!id) {
          detail.innerHTML = ""
          return
        }
        detail.innerHTML = '<div class="empty">Загрузка…</div>'
        clearMessage(message)
        try {
          const data = await api(`/campaigns/${id}`)
          renderDetail(data)
        } catch (err) {
          detail.innerHTML = ""
          showMessage(message, `Ошибка: ${err.message}`, "error")
        }
      }

      async function loadCampaigns() {
        try {
          const campaigns = await api("/campaigns/")
          const active = campaigns.filter((c) => c.state === "active")
          if (!active.length) {
            select.innerHTML = '<option value="">Кампаний нет</option>'
            return
          }
          select.innerHTML = active
            .map(
              (c) =>
                `<option value="${c.id}">${escapeHtml(c.name)} (id ${c.id})</option>`,
            )
            .join("")

          const params = new URLSearchParams(location.search)
          const preselect = params.get("id")
          if (preselect && active.some((c) => String(c.id) === preselect)) {
            select.value = preselect
          }
          loadDetail(select.value)
        } catch (err) {
          select.innerHTML = '<option value="">Ошибка загрузки</option>'
          showMessage(message, `Не удалось загрузить кампании: ${err.message}`, "error")
        }
      }

      async function reloadDetail(campaignId) {
        clearMessage(message)
        try {
          const data = await api(`/campaigns/${campaignId}`)
          renderDetail(data)
        } catch (err) {
          showMessage(message, `Ошибка перезагрузки: ${err.message}`, "error")
        }
      }

      detail.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]")
        if (!button) return

        const campaignId = button.dataset.campaign
        const streamId = button.dataset.stream
        const base = `/campaigns/${campaignId}/streams/${streamId}/offers`

        setLoading(button, true, "…")
        try {
          if (button.dataset.action === "remove-offer") {
            await api(`${base}/${button.dataset.offer}`, { method: "DELETE" })
            showMessage(message, "Оффер удалён, доли пересчитаны", "success")
          } else {
            const selectEl = detail.querySelector(
              `select[data-add-select="${streamId}"]`,
            )
            if (!selectEl || !selectEl.value) return
            await api(base, {
              method: "POST",
              body: JSON.stringify({ offer_id: Number(selectEl.value) }),
            })
            showMessage(message, "Оффер добавлен, доли пересчитаны", "success")
          }
          await reloadDetail(campaignId)
        } catch (err) {
          showMessage(message, `Ошибка: ${err.message}`, "error")
          setLoading(button, false)
        }
      })

      select.addEventListener("change", () => loadDetail(select.value))

      async function init() {
        try {
          offersCache = await api("/offers/")
        } catch {
          offersCache = []
        }
        await loadCampaigns()
      }

      init()
    </script>
  </body>
</html>
