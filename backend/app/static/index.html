<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Создание кампании — Keitaro Wrapper</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Создание кампании</h1>
        <nav>
          <a href="/" class="active">Создать</a>
          <a href="/edit.html">Редактор</a>
          <a href="/docs" target="_blank">API</a>
        </nav>
      </header>

      <div id="message" class="message"></div>

      <form id="create-form">
        <fieldset>
          <legend>Параметры</legend>

          <div class="field">
            <label for="geo">Гео (ISO-2)</label>
            <input
              type="text"
              id="geo"
              name="geo"
              placeholder="MX"
              maxlength="2"
              required
              autocomplete="off"
            />
            <div class="hint">Двухбуквенный код страны: MX, AU, RO</div>
          </div>

          <div class="field">
            <label for="offer">Оффер</label>
            <select id="offer" name="offer_id" required>
              <option value="">Загрузка…</option>
            </select>
            <div class="hint">Первый поток для этого гео уйдёт на Google, второй — на оффер</div>
          </div>
        </fieldset>

        <button type="submit" id="submit-btn">Создать кампанию</button>
      </form>

      <div id="result"></div>
    </main>

    <script src="/common.js"></script>
    <script>
      const form = document.getElementById("create-form")
      const geoInput = document.getElementById("geo")
      const offerSelect = document.getElementById("offer")
      const submitBtn = document.getElementById("submit-btn")
      const message = document.getElementById("message")
      const result = document.getElementById("result")

      geoInput.addEventListener("input", () => {
        geoInput.value = geoInput.value.toUpperCase().replace(/[^A-Z]/g, "")
      })

      async function loadOffers() {
        try {
          const offers = await api("/offers/")
          if (!offers.length) {
            offerSelect.innerHTML = '<option value="">Офферов нет</option>'
            return
          }
          offerSelect.innerHTML = offers
            .map(
              (o) =>
                `<option value="${o.id}">${escapeHtml(o.name)} (id ${o.id})</option>`,
            )
            .join("")
        } catch (err) {
          offerSelect.innerHTML = '<option value="">Ошибка загрузки</option>'
          showMessage(message, `Не удалось загрузить офферы: ${err.message}`, "error")
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault()
        clearMessage(message)
        result.innerHTML = ""
        setLoading(submitBtn, true, "Создание…")

        try {
          const campaign = await api("/campaigns/", {
            method: "POST",
            body: JSON.stringify({
              geo: geoInput.value,
              offer_id: Number(offerSelect.value),
            }),
          })
          showMessage(
            message,
            `Кампания создана: ${campaign.name} (id ${campaign.id})`,
            "success",
          )
          result.innerHTML = `
            <table>
              <tbody>
                <tr><th>ID</th><td>${campaign.id}</td></tr>
                <tr><th>Название</th><td>${escapeHtml(campaign.name)}</td></tr>
                <tr><th>Домен</th><td>${escapeHtml(campaign.domain || campaign.domain_id)}</td></tr>
                <tr><th>Статус</th><td><span class="badge">${escapeHtml(campaign.state)}</span></td></tr>
              </tbody>
            </table>
            <p><a href="/edit.html?id=${campaign.id}">Открыть в редакторе →</a></p>
          `
          form.reset()
        } catch (err) {
          showMessage(message, `Ошибка: ${err.message}`, "error")
        } finally {
          setLoading(submitBtn, false)
        }
      })

      loadOffers()
    </script>
  </body>
</html>
